# SSR Stack — Slack App manifest (Recipe 01 minimum)
# Import via https://api.slack.com/apps → Create New App → From an app manifest

display_information:
  name: SSR Bot
  description: Salesforce Slack Recipes — outbound notifications from Salesforce Flows
  background_color: "#1a1a2e"

features:
  bot_user:
    display_name: SSR Bot
    always_online: false

oauth_config:
  scopes:
    bot:
      - chat:write

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
